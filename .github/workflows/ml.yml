name: ML Pipeline

on:
  push:
    branches: [main]

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.10

      - name: Install
        run: make install

      - name: Train
        run: make train

      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: mlruns
          path: mlruns/
